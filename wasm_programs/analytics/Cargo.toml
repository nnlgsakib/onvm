[package]
name = "onvm_analytics"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
blake3 = "1.5"
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }
base64 = "0.22"
once_cell = "1.20"

[profile.release]
lto = true
opt-level = "z"
panic = "abort"
strip = true
codegen-units = 1
